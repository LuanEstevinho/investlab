# Ambiente local completo (sem Azure): mongo + sql server + 2 microserviços + BFF.
# A Azure Function roda à parte com `func start` (Azure Functions Core Tools) na porta 7071.
# Segredos de produção NUNCA entram aqui; estes valores são apenas de desenvolvimento local.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "1"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}"
    ports: ["1433:1433"]

  ms-ativos:
    build: { context: ., dockerfile: services/ms-ativos/Dockerfile }
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017
      # SERVICEBUS_CONNECTION: (opcional) sem ela os eventos vão para o log
    ports: ["3001:3001"]
    depends_on: [mongo]

  ms-carteira:
    build: { context: ., dockerfile: services/ms-carteira/Dockerfile }
    environment:
      PORT: 3002
      AZURE_SQL_CONNECTION: "Server=sqlserver,1433;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=false;TrustServerCertificate=true"
    ports: ["3002:3002"]
    depends_on: [sqlserver]

  bff-web:
    build: { context: ., dockerfile: services/bff-web/Dockerfile }
    environment:
      PORT: 3000
      MS_ATIVOS_URL: http://ms-ativos:3001
      MS_CARTEIRA_URL: http://ms-carteira:3002
      FN_SIMULACAO_URL: http://host.docker.internal:7071
      CORS_ORIGINS: http://localhost:5000,http://localhost:5001,http://localhost:5002
    ports: ["3000:3000"]
    depends_on: [ms-ativos, ms-carteira]
